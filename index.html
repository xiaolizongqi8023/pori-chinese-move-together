<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pori Chinese Move Together</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f4;
      color: #1f3027;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 90%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 38px 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 12px;
    }

    .names {
      font-size: 17px;
      color: #68746e;
      margin-bottom: 10px;
    }

    .slogan {
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 30px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
    }

    .primary {
      background: #21382c;
      color: white;
    }

    .secondary {
      background: #edf0ed;
      color: #21382c;
    }

    .info {
      font-size: 14px;
      color: #7a837e;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">💪</div>

    <h1>Pori Chinese Move Together</h1>

    <div class="names">
      Qiqi · Zhuzhu · Menghua
    </div>

    <p class="slogan">
      Yhdessä liikkumaan,<br>
      yhdessä pysymään liikkeessä.
    </p>

    <div class="buttons">
      <button class="primary" onclick="alert('Rekisteröinti tulee pian!')">
        Rekisteröidy
      </button>

      <button class="secondary" onclick="alert('Kirjautuminen tulee pian!')">
        Kirjaudu
      </button>
    </div>

    <div class="info">
      Kiinalaisille Poriin ja lähialueille,<br>
      jotka haluavat liikkua yhdessä ja pitää toisensa motivoituneina.
    </div>

  </div>

</body>
</html>
